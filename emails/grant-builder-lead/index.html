<html>
  <body style="margin:0;padding:0;background:#f4f6fa;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fa;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #dce2ee;border-radius:12px;overflow:hidden;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#1e2a3a;">
            <tr>
              <td style="background:#2c3e50;padding:16px 24px;">
                <span style="color:#ecf0f1;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;">New Grant Builder lead</span>
              </td>
            </tr>
            <tr>
              <td style="padding:26px 24px;">
                <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#52647a;">
                  Someone used the Grant Builder.
                </p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:15px;">
                  <tr>
                    <td style="padding:8px 0;color:#a0afc0;width:70px;">Name</td>
                    <td style="padding:8px 0;font-weight:600;">{{name}}</td>
                  </tr>
                  <tr>
                    <td style="padding:8px 0;color:#a0afc0;border-top:1px solid #f0f3f9;">Email</td>
                    <td style="padding:8px 0;border-top:1px solid #f0f3f9;">
                      <a href="mailto:{{email}}" style="color:#2563eb;font-weight:600;text-decoration:none;">{{email}}</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:22px 0 0;font-size:13px;line-height:1.6;color:#a0afc0;">
                  They have not been emailed anything, so this is the only record of the lead.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
